<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AlgoQuest — Learn DSA &amp; R by Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo">AlgoQuest</div>
      <div class="menu-label">Learning</div>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="sidebar-footer">
        <button id="reset-btn" class="text-link">Reset progress</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <input id="search-input" class="search-input" type="text" placeholder="Search a level…" />
        <div class="xp-chip"><strong id="xp-value">0</strong> XP &nbsp;·&nbsp; <span id="rank-badge">Novice</span></div>
      </div>
      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/engine.js"></script>
  <script src="js/components.js"></script>
  <script src="js/dsa-levels.js"></script>
  <script src="js/r-levels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
